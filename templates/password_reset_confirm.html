{% extends 'base.html' %}
{% load static %}

{% block title %}Set New Password - LifeFlow BD{% endblock %}

{% block content %}
<div class="dashboard-container" style="max-width: 480px; margin: 2rem auto;">
  <div class="dash-card">
    <div class="dash-card-header" style="justify-content: center; text-align: center;">
      <h1 class="dash-card-title" style="font-size: 1.5rem; color: #FFFFFF;">Set New Password</h1>
    </div>

    <p style="font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 1.5rem; line-height: 1.5;">
      Account verified for <strong style="color: #60A5FA;">{{ target_user.email|default:target_user.username }}</strong>. Please enter your new password below.
    </p>

    <form method="POST" action="{% url 'password_reset_confirm' uidb64 token %}">
      {% csrf_token %}
      <div class="form-group" style="margin-bottom: 1rem;">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" placeholder="Minimum 6 characters" required style="width: 100%;">
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required style="width: 100%;">
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; padding: 12px; justify-content: center;">
        Save New Password & Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
